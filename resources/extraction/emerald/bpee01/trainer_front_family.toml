# Stage R7A — complete trainer-front family descriptor (Emerald BPEE rev 0).
#
# SINGLE declarative source of truth for the full trainer-front graphics
# family: 93 front sheets + 93 front palettes. Consumed by the R7A family
# generator (tools/gen3_resources/trainer_family/gen_trainer_family) which
# emits catalog.toml, bindings.generated.toml, ownership.generated.toml and
# trainer_front_consumers.generated.toml. Do not hand-edit the generated
# files; edit this descriptor and re-run the generator.
#
# Canonical-name rule (R7A §4): canonical = ASCII-lowercase of the
# TRAINER_PIC_* constant suffix, underscores -> hyphens. One explicit,
# reviewable mapping; names are persistent API.
#
# Fields:
#   canonical   public component of the canonical id (persistent API).
#   slug        source-artifact basename (graphics/trainers/<dir>/<slug>.*).
#   symbol      C symbol suffix (gTrainerFrontPic_<symbol> / gTrainerPalette_<symbol>).
#   pic         TRAINER_PIC_ constant suffix (identity anchor, index).
#   index       explicit table index (order-independence for determinism).
#   size_mult   table .size multiplier (consumer allocation metadata, NOT
#               payload size; all sheets decode to 2048 bytes regardless).
#   palette_dir "front_pics" or "palettes" (the 5 special palettes).
#   ownership_native  ROM_BASE_ONLY (brendan, R6) or COMPILED_PENDING_MIGRATION.
#   back_palette_index  optional: gTrainerBackPicPaletteTable slot that ALSO
#               consumes this FRONT palette (additional consumer, R7A §13).
#
# Resource ID templates build the canonical id for each trainer as
#   <namespace>:<path>  with "%s" = the trainer canonical component. The two
#   patterns are game/resource-path specific (a FireRed family descriptor would
#   supply its own); the generator machinery itself is game-neutral (§23).
#
family_version = 1
game = "emerald"
rom_profile = "bpee01-rev0"
namespace = "emerald"
resource_api = "1.0.0"
catalog_version = 1
sheet_id_template = "emerald:trainer/%s/battle/front/sheet"
palette_id_template = "emerald:trainer/%s/battle/front/normal-palette"
resource_type_sheet = "tile-graphics"
resource_type_palette = "palette"
schema = 1
required_for_base = true
sheet_decoded_size = 2048
palette_decoded_size = 32
sheet_encoding = "gba-lz77"
palette_encoding = "gba-lz77"
sheet_representation = "gba-4bpp-tiles"
palette_representation = "gba-bgr555-palette"
# R8 family-shape fields (additive; the generated outputs do not depend on the
# presence of these names, only on their values). The back family descriptor
# supplies its own values for the same fields.
sheet_symbol_template = "gTrainerFrontPic_%s"
palette_symbol_template = "gTrainerPalette_%s"
sheet_artifact_template = "graphics/trainers/front_pics/%s.4bpp.lz"
sheet_table = "gTrainerFrontPicTable"
palette_table = "gTrainerFrontPicPaletteTable"
family_label = "front"

