canonical = "brendan"
slug = "brendan"
symbol = "Brendan"
pic = "BRENDAN"
index = 0
sheet_size = 8192
frames = 4
size_mult = 4
frame_array = "gTrainerBackPicTable_Brendan"
palette_dir = "back_pics"
has_palette = false
ownership_native = "ROM_BASE_ONLY"

