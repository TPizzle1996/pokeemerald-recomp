# ─── non-opcode grammars ───

[[non_opcode_grammars]]
name = "map_dispatch_table"
description = "Map script dispatch table: repeated {tag:u8, script:ADDR32_SCRIPT} terminated by tag=0. Tags 2 (ON_FRAME_TABLE) and 4 (ON_WARP_INTO_MAP_TABLE) point to conditional tables."
row_format = ["U8", "ADDR32_SCRIPT"]
terminator = "tag == 0"
row_size = 5
conditional_tags = [2, 4]

[[non_opcode_grammars]]
name = "map_conditional_table"
description = "Conditional map-script row table: repeated {var:VAR16, value:VAR16, script:ADDR32_SCRIPT} terminated by var == 0. First matching row is executed."
row_format = ["VAR16", "VAR16", "ADDR32_SCRIPT"]
terminator = "var == 0"
row_size = 8

[[non_opcode_grammars]]
name = "mart_list"
description = "Pokemart item list: sequence of u16 item IDs terminated by ITEM_NONE (0). Referenced by pokemart command."
row_format = ["U16_LE"]
terminator = "ITEM_NONE (0x0000)"
row_size = 2

[[non_opcode_grammars]]
name = "decor_shop_list"
description = "Decoration shop item list: sequence of u16 decoration IDs terminated by DECOR_NONE (0). Referenced by pokemartdecoration/pokemartdecoration2 commands."
row_format = ["U16_LE"]
terminator = "DECOR_NONE (0x0000)"
row_size = 2

[[non_opcode_grammars]]
name = "mystery_event_vm"
description = "Mystery Event script interpreter: distinct 17-command VM with its own EWRAM context. Not part of the ordinary field script language. Recorded for exclusion from ordinary classification."
opcode_count = 17
owned_by = "mystery_event_script.c"
is_ordinary_field = false

